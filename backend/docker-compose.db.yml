# REMOTEIQ_POSTGRES_LOCAL_DOCKER_V1
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-remoteiq}"
      POSTGRES_DB: "${POSTGRES_DB:-remoteiq}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - remoteiq_postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  remoteiq_postgres_data:

secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:-./.secrets/postgres_password}"
