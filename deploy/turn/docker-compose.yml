# Built-in TURN relay for Remote Console. Setup: docs/remote-console-turn.md
#
#   cp .env.example .env    (then fill it in)
#   docker compose up -d
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # A relay handles a large range of ports, which is far simpler on the host network.
    network_mode: host
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_AUTH_SECRET:?Set TURN_AUTH_SECRET in .env}
      - --realm=${TURN_REALM:?Set TURN_REALM in .env}
      - --listening-port=${TURN_PORT:-3478}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --no-cli
      - --no-multicast-peers
      # Stops anyone with valid credentials using the relay to reach your internal network.
      - --no-loopback-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
